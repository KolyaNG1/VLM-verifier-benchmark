[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-bench"
version = "0.1.0"
description = "Воспроизводимый бенчмарк L2 для VLM-судей"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0,<2",
    "requests>=2.31,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
